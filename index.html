<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080014">
<title>Govind Sharma • 21st Birthday</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050008;
    color:#fff;
}

body{
    touch-action:pan-y;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#080014;
    transition:background 1s ease;
}

/* =====================================================
   BACKGROUND
===================================================== */

.bgGlow{
    position:absolute;
    width:55vw;
    height:55vw;
    border-radius:50%;
    filter:blur(70px);
    opacity:.25;
    pointer-events:none;
    transition:all 1s ease;
}

.glow1{
    top:-20%;
    left:-15%;
    background:#ff1493;
}

.glow2{
    right:-20%;
    bottom:-20%;
    background:#00d9ff;
}

#stars{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    animation:twinkle 1.5s ease-in-out infinite alternate;
}

@keyframes twinkle{
    from{opacity:.1;transform:scale(.5)}
    to{opacity:1;transform:scale(1.5)}
}

/* =====================================================
   SLIDES
===================================================== */

#slides{
    position:relative;
    width:100%;
    height:100%;
    z-index:5;
}

.slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 20px 95px;

    opacity:0;
    visibility:hidden;

    transform:scale(.82) rotateX(12deg);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.8,.2,1),
        visibility .6s;
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:scale(1) rotateX(0);
}

.content{
    position:relative;
    width:min(900px,94vw);
    text-align:center;
    z-index:10;
}

.kicker{
    margin-bottom:18px;
    font-size:clamp(11px,2vw,16px);
    letter-spacing:5px;
    text-transform:uppercase;
    font-weight:800;
    color:var(--accent);
    text-shadow:0 0 18px var(--accent);
}

h1{
    font-size:clamp(42px,10vw,105px);
    line-height:.95;
    font-weight:900;
    color:var(--main);
    text-shadow:
        0 0 15px var(--accent),
        0 0 40px var(--accent);
}

h2{
    color:var(--main);
    text-shadow:0 0 22px var(--accent);
}

.subtitle{
    margin-top:22px;
    font-size:clamp(17px,4vw,28px);
    line-height:1.5;
    color:var(--secondary);
}

.small{
    margin-top:15px;
    color:var(--secondary);
    opacity:.8;
}

/* =====================================================
   THEMES
===================================================== */

.theme1{
    --main:#fff2a8;
    --accent:#ffd000;
    --secondary:#63eaff;
}

.theme2{
    --main:#ff65c7;
    --accent:#a855ff;
    --secondary:#fff;
}

.theme3{
    --main:#54eaff;
    --accent:#0077ff;
    --secondary:#ffffff;
}

.theme4{
    --main:#ffd85a;
    --accent:#ff6b00;
    --secondary:#fff1d0;
}

.theme5{
    --main:#72ff9b;
    --accent:#00d084;
    --secondary:#8ff3ff;
}

.theme6{
    --main:#d58aff;
    --accent:#ff4dc4;
    --secondary:#fff;
}

.theme7{
    --main:#ffe44d;
    --accent:#00e5ff;
    --secondary:#ffffff;
}

.theme8{
    --main:#ff9b42;
    --accent:#ff304f;
    --secondary:#ffd7c2;
}

.theme9{
    --main:#ff75c8;
    --accent:#ffd33d;
    --secondary:#fff;
}

.theme10{
    --main:#8cff65;
    --accent:#00e5ff;
    --secondary:#e5ffff;
}

.theme11{
    --main:#d18cff;
    --accent:#ffd43d;
    --secondary:#fff;
}

.theme12{
    --main:#ff6d9d;
    --accent:#49eaff;
    --secondary:#fff;
}

.theme13{
    --main:#67dfff;
    --accent:#ffd84d;
    --secondary:#fff;
}

.theme14{
    --main:#ff5ce1;
    --accent:#36f4ff;
    --secondary:#fff;
}

.theme15{
    --main:#ff8eac;
    --accent:#ffd85a;
    --secondary:#fff;
}

.theme16{
    --main:#fff;
    --accent:#ff4fd8;
    --secondary:#ffe45c;
}

/* =====================================================
   GLASS CARD
===================================================== */

.card{
    width:min(700px,94vw);
    margin:auto;
    padding:32px 24px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.2);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 35px rgba(255,255,255,.025);

    backdrop-filter:blur(18px);
}

.card p{
    margin-top:14px;
    font-size:clamp(16px,3vw,21px);
    line-height:1.65;
    color:var(--secondary);
}

/* =====================================================
   BALLOONS
===================================================== */

.balloon{
    position:absolute;
    width:65px;
    height:82px;
    border-radius:50% 50% 45% 45%;
    z-index:2;
    opacity:.8;
    animation:balloonFloat 4s ease-in-out infinite;
}

.balloon:after{
    content:"";
    position:absolute;
    left:50%;
    top:80px;
    width:2px;
    height:150px;
    background:rgba(255,255,255,.4);
}

.b1{
    left:4%;
    top:13%;
    background:linear-gradient(135deg,#ff2e9a,#8d00ff);
}

.b2{
    right:5%;
    top:17%;
    background:linear-gradient(135deg,#00eaff,#006aff);
    animation-delay:1s;
}

.b3{
    left:8%;
    bottom:10%;
    background:linear-gradient(135deg,#ffe000,#ff6900);
    animation-delay:1.5s;
}

.b4{
    right:8%;
    bottom:8%;
    background:linear-gradient(135deg,#6cff79,#00a95c);
    animation-delay:2s;
}

@keyframes balloonFloat{
    0%,100%{
        transform:translateY(0) rotate(-4deg);
    }
    50%{
        transform:translateY(-25px) rotate(5deg);
    }
}

/* =====================================================
   3D CUBE
===================================================== */

.cubeScene{
    width:170px;
    height:170px;
    margin:0 auto 35px;
    perspective:700px;
}

.cube{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    animation:cubeRotate 8s linear infinite;
}

.face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:62px;
    border:2px solid rgba(255,255,255,.35);
    background:
        linear-gradient(
            135deg,
            rgba(255,0,153,.75),
            rgba(76,0,255,.75)
        );
    box-shadow:0 0 30px rgba(255,0,180,.4);
}

.front{transform:translateZ(85px)}
.back{transform:rotateY(180deg) translateZ(85px)}
.right{transform:rotateY(90deg) translateZ(85px)}
.left{transform:rotateY(-90deg) translateZ(85px)}
.top{transform:rotateX(90deg) translateZ(85px)}
.bottom{transform:rotateX(-90deg) translateZ(85px)}

@keyframes cubeRotate{
    from{transform:rotateX(-8deg) rotateY(0)}
    to{transform:rotateX(-8deg) rotateY(360deg)}
}

/* =====================================================
   BIG 21
===================================================== */

.big21{
    font-size:clamp(160px,46vw,430px);
    line-height:.7;
    font-weight:1000;

    color:#54eaff;

    text-shadow:
        0 0 10px #00aaff,
        0 0 40px #0077ff,
        0 0 80px #7b2cff;

    animation:pulse21 2s ease-in-out infinite;
}

@keyframes pulse21{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.07)}
}

/* =====================================================
   HANDWRITING
===================================================== */

.handwritingBox{
    width:min(850px,96vw);
    margin:0 auto;
}

.handwriting{
    width:100%;
    height:auto;
    overflow:visible;
}

.handwriting path{
    fill:none;
    stroke:#ff62d2;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:4000;
    stroke-dashoffset:4000;

    filter:
        drop-shadow(0 0 5px #ff62d2)
        drop-shadow(0 0 18px #a600ff);

    animation:writeName 6s ease-in-out forwards;
}

.handwriting .smallPath{
    stroke:#ffd83d;
    stroke-width:3;
    animation-delay:4.8s;
}

@keyframes writeName{
    to{
        stroke-dashoffset:0;
    }
}

.handwritingHint{
    margin-top:20px;
    color:#63eaff;
    font-size:16px;
}

/* =====================================================
   FUNNY CARDS
===================================================== */

.funnyGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:28px;
}

.funnyCard{
    min-height:150px;
    padding:20px 12px;

    border-radius:22px;

    border:1px solid var(--accent);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 0 22px color-mix(
            in srgb,
            var(--accent),
            transparent 70%
        );

    transition:.3s;
}

.funnyCard:hover{
    transform:
        translateY(-8px)
        rotateY(8deg);
}

.funnyIcon{
    font-size:42px;
    margin-bottom:12px;
}

.funnyCard p{
    color:var(--secondary);
    line-height:1.4;
    font-size:14px;
}

/* =====================================================
   CAKE
===================================================== */

.cakeArea{
    position:relative;
    width:300px;
    height:310px;
    margin:auto;
}

.cake{
    position:absolute;
    left:40px;
    bottom:35px;
    width:220px;
    height:100px;

    background:
        linear-gradient(
            #ff83c8,
            #d72b88
        );

    border-radius:15px 15px 25px 25px;

    box-shadow:
        0 20px 50px rgba(255,0,160,.4);
}

.cakeTop{
    position:absolute;
    left:0;
    top:-32px;
    width:220px;
    height:45px;
    border-radius:50%;
    background:#fff1fa;
    box-shadow:inset 0 -10px #ffc3e2;
}

.cakeNumber{
    position:absolute;
    inset:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    font-weight:900;
    color:white;
}

.candle{
    position:absolute;
    bottom:135px;
    width:14px;
    height:65px;
    border-radius:4px;

    background:
        repeating-linear-gradient(
            45deg,
            #fff 0 8px,
            #ff3d9e 8px 16px
        );

    z-index:5;
}

.candle1{left:88px}
.candle2{left:143px}
.candle3{left:198px}

.flame{
    position:absolute;
    bottom:194px;
    width:20px;
    height:30px;
    border-radius:50% 50% 45% 45%;

    background:
        linear-gradient(
            #fff,
            #ffe000,
            #ff5500
        );

    filter:drop-shadow(0 0 12px #ffad00);

    animation:flameMove .25s infinite alternate;

    z-index:6;
}

.flame1{left:85px}
.flame2{left:140px}
.flame3{left:195px}

@keyframes flameMove{
    from{
        transform:scale(.9) rotate(-4deg);
    }
    to{
        transform:scale(1.15) rotate(5deg);
    }
}

.cakeArea.blown .flame{
    animation:none;
    opacity:0;
    transform:translateY(-55px) scale(.1);
    transition:.5s;
}

/* =====================================================
   GAME BUTTONS
===================================================== */

.gameButton{
    margin-top:24px;
    padding:15px 26px;

    border:none;
    border-radius:50px;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--main)
        );

    color:#080008;
    font-weight:900;
    font-size:15px;

    cursor:pointer;

    box-shadow:
        0 0 25px var(--accent);

    transition:.25s;
}

.gameButton:hover{
    transform:translateY(-3px) scale(1.04);
}

.gameButton:active{
    transform:scale(.95);
}

.gameResult{
    min-height:35px;
    margin-top:18px;
    color:var(--main);
    font-weight:bold;
    font-size:18px;
}

/* =====================================================
   GAME CHOICES
===================================================== */

.choiceGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:25px;
}

.choice{
    min-height:100px;
    border-radius:20px;

    border:2px solid var(--accent);

    background:rgba(255,255,255,.06);

    color:var(--secondary);

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:.25s;
}

.choice:hover{
    background:rgba(255,255,255,.16);
    transform:translateY(-5px);
}

.choice.correct{
    border-color:#62ff91;
    background:rgba(0,255,100,.15);
    color:#62ff91;
}

.choice.wrong{
    border-color:#ff5478;
    background:rgba(255,0,70,.15);
    color:#ff7c98;
}

/* =====================================================
   MEMORY WALL
===================================================== */

.memoryWall{
    position:relative;
    width:min(720px,95vw);
    height:360px;
    margin:auto;
}

.memory{
    position:absolute;
    width:145px;
    min-height:125px;

    padding:16px;

    background:#fff;
    color:#111;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-weight:bold;

    box-shadow:0 18px 35px rgba(0,0,0,.5);

    transition:.4s;
}

.memory:hover{
    transform:scale(1.1) rotate(0deg) !important;
    z-index:10;
}

.memory:nth-child(1){
    left:4%;
    top:8%;
    transform:rotate(-9deg);
}

.memory:nth-child(2){
    left:38%;
    top:0;
    transform:rotate(5deg);
}

.memory:nth-child(3){
    right:3%;
    top:13%;
    transform:rotate(8deg);
}

.memory:nth-child(4){
    left:17%;
    bottom:2%;
    transform:rotate(6deg);
}

.memory:nth-child(5){
    right:17%;
    bottom:0;
    transform:rotate(-7deg);
}

.memoryIcon{
    font-size:38px;
    margin-bottom:10px;
}

/* =====================================================
   PROGRESS
===================================================== */

#progress{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:5px;

    z-index:100;
}

.dot{
    width:7px;
    height:7px;
    border-radius:10px;
    background:rgba(255,255,255,.22);
    transition:.3s;
    cursor:pointer;
}

.dot.active{
    width:24px;
    background:var(--main);
    box-shadow:0 0 12px var(--accent);
}

/* =====================================================
   NAVIGATION
===================================================== */

#navigation{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;

    display:flex;
    justify-content:center;
    gap:12px;

    z-index:100;
}

.navButton{
    padding:12px 19px;

    border-radius:50px;

    border:1px solid var(--accent);

    background:rgba(255,255,255,.08);

    color:var(--secondary);

    font-weight:bold;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.25s;
}

.navButton:hover{
    background:var(--accent);
    color:#080008;
}

/* =====================================================
   MUSIC
===================================================== */

#musicButton{
    position:absolute;
    right:16px;
    bottom:18px;

    z-index:110;

    padding:12px 16px;

    border-radius:50px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(255,255,255,.08);

    color:#fff;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

/* =====================================================
   CONFETTI
===================================================== */

.confetti{
    position:absolute;
    top:-25px;
    width:9px;
    height:17px;
    z-index:80;
    pointer-events:none;

    animation:confettiFall linear forwards;
}

@keyframes confettiFall{
    to{
        transform:
            translate3d(
                var(--moveX),
                110vh,
                0
            )
            rotate(720deg);

        opacity:0;
    }
}

/* =====================================================
   FIREWORK
===================================================== */

.firework{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;

    left:50%;
    top:45%;

    z-index:90;

    background:#fff;

    animation:firework 1.1s ease-out forwards;
}

@keyframes firework{
    0%{
        opacity:1;
        box-shadow:0 0 0 0 #fff;
    }

    100%{
        opacity:0;

        box-shadow:
            100px -80px 0 3px #ff4ca8,
            -100px -70px 0 3px #3cecff,
            130px 30px 0 3px #ffd400,
            -130px 40px 0 3px #65ff8c,
            70px 105px 0 3px #ff793d,
            -70px 105px 0 3px #bd76ff;
    }
}

/* =====================================================
   FINAL
===================================================== */

.finalTitle{
    animation:finalGlow 1.5s ease-in-out infinite alternate;
}

@keyframes finalGlow{
    from{
        text-shadow:
            0 0 15px #ff3cb5,
            0 0 35px #00d9ff;
    }

    to{
        text-shadow:
            0 0 30px #ffd400,
            0 0 70px #ff3cb5,
            0 0 100px #8a4dff;
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .slide{
        padding:65px 14px 90px;
    }

    .balloon{
        width:45px;
        height:60px;
    }

    .balloon:after{
        top:58px;
        height:100px;
    }

    .cubeScene{
        width:130px;
        height:130px;
        margin-bottom:25px;
    }

    .front{transform:translateZ(65px)}
    .back{transform:rotateY(180deg) translateZ(65px)}
    .right{transform:rotateY(90deg) translateZ(65px)}
    .left{transform:rotateY(-90deg) translateZ(65px)}
    .top{transform:rotateX(90deg) translateZ(65px)}
    .bottom{transform:rotateX(-90deg) translateZ(65px)}

    .face{
        font-size:44px;
    }

    .funnyGrid{
        gap:7px;
    }

    .funnyCard{
        min-height:125px;
        padding:13px 7px;
    }

    .funnyIcon{
        font-size:31px;
    }

    .funnyCard p{
        font-size:11px;
    }

    .memoryWall{
        height:300px;
    }

    .memory{
        width:105px;
        min-height:95px;
        font-size:11px;
        padding:10px;
    }

    .memoryIcon{
        font-size:27px;
    }

    .choiceGrid{
        gap:9px;
    }

    .choice{
        min-height:85px;
        font-size:13px;
        padding:8px;
    }

    #musicButton{
        bottom:63px;
        right:10px;
        padding:10px 13px;
    }

    #navigation{
        bottom:12px;
    }

    .navButton{
        padding:10px 15px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="bgGlow glow1"></div>
    <div class="bgGlow glow2"></div>

    <div id="stars"></div>

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <div id="progress"></div>

    <main id="slides">

        <!-- =================================================
             SLIDE 1
        ================================================== -->

        <section class="slide theme1 active">

            <div class="content">

                <div class="cubeScene">

                    <div class="cube">

                        <div class="face front">🎁</div>
                        <div class="face back">🎂</div>
                        <div class="face right">🎉</div>
                        <div class="face left">🥳</div>
                        <div class="face top">✨</div>
                        <div class="face bottom">🎈</div>

                    </div>

                </div>

                <div class="kicker">
                    A Special Day
                </div>

                <h1 class="typing"
                    data-text="Something Special Is Coming">
                </h1>

                <p class="subtitle">
                    🎁 A little surprise has arrived...
                </p>
